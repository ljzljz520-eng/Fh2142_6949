<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>单词拼写挑战</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">SC</span>
          <div>
            <strong>单词拼写挑战</strong>
            <span>Spelling Challenge</span>
          </div>
        </div>
        <nav aria-label="主菜单">
          <button class="nav-item active" data-view="challenge">挑战</button>
          <button class="nav-item" data-view="mistakes">错词回放</button>
          <button class="nav-item" data-view="history">历史统计</button>
          <button class="nav-item" data-view="review">验收汇总</button>
        </nav>
        <div class="sidebar-status">
          <span class="status-dot"></span>
          本地内存模式
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <span class="eyebrow">TRAINING DESK</span>
            <h1 id="page-title">拼写挑战</h1>
          </div>
          <div class="score-badge"><span>当前得分</span><strong id="header-score">0</strong></div>
        </header>

        <section class="view active" id="view-challenge">
          <div class="toolbar">
            <label for="level">词库难度</label>
            <select id="level">
              <option value="simple">简单</option>
              <option value="medium">中等</option>
            </select>
            <span class="progress-label" id="progress-label">第 1 题</span>
          </div>
          <div class="challenge-layout">
            <article class="challenge-board">
              <div class="prompt-label">中文提示</div>
              <div class="prompt" id="word-prompt">加载中</div>
              <div class="scramble-label">乱序字母</div>
              <div class="scramble" id="word-scramble">-----</div>
              <form id="answer-form">
                <label for="answer">英文单词</label>
                <div class="answer-row">
                  <input id="answer" name="answer" autocomplete="off" spellcheck="false" required>
                  <button class="primary" type="submit">提交答案</button>
                </div>
              </form>
              <div class="feedback" id="feedback" aria-live="polite"></div>
            </article>
            <aside class="session-panel">
              <h2>本轮进度</h2>
              <dl>
                <div><dt>已答</dt><dd id="session-attempts">0</dd></div>
                <div><dt>答对</dt><dd id="session-correct">0</dd></div>
                <div><dt>正确率</dt><dd id="session-accuracy">0%</dd></div>
              </dl>
              <button class="secondary" id="next-word" type="button">下一题</button>
            </aside>
          </div>
        </section>

        <section class="view" id="view-mistakes">
          <div class="section-heading">
            <div><span class="eyebrow">REPLAY</span><h2>错词回放</h2></div>
            <button class="secondary" id="refresh-mistakes" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>提示</th><th>乱序</th><th>正确单词</th><th>最近答案</th><th>次数</th></tr></thead>
              <tbody id="mistakes-body"></tbody>
            </table>
            <div class="empty-state" id="mistakes-empty">暂无错词</div>
          </div>
        </section>

        <section class="view" id="view-history">
          <div class="stats-grid">
            <div class="metric"><span>总答题</span><strong id="stat-attempts">0</strong></div>
            <div class="metric"><span>正确率</span><strong id="stat-accuracy">0%</strong></div>
            <div class="metric"><span>累计得分</span><strong id="stat-score">0</strong></div>
            <div class="metric"><span>平均用时</span><strong id="stat-average">0s</strong></div>
          </div>
          <div class="table-wrap history-table">
            <table>
              <thead><tr><th>题目</th><th>提交答案</th><th>结果</th><th>用时</th><th>得分</th></tr></thead>
              <tbody id="history-body"></tbody>
            </table>
            <div class="empty-state" id="history-empty">暂无答题记录</div>
          </div>
        </section>

        <section class="view" id="view-review">
          <div class="review-layout">
            <div class="review-form-panel">
              <span class="eyebrow">DAILY REVIEW</span>
              <h2 id="review-title">今日词库验收</h2>
              <form id="review-form">
                <label for="operator">操作员</label>
                <input id="operator" name="operator" required>
                <label for="confirmation">确认内容</label>
                <textarea id="confirmation" name="confirmation" rows="4" required></textarea>
                <button class="primary" type="submit">提交确认</button>
              </form>
              <div class="feedback" id="review-feedback" aria-live="polite"></div>
            </div>
            <div class="summary-panel">
              <div class="section-heading"><h2>确认汇总</h2><button class="secondary" id="refresh-review" type="button">刷新</button></div>
              <div id="confirmation-list" class="confirmation-list"></div>
              <div class="empty-state" id="confirmation-empty">暂无确认内容</div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
